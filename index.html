    <script type="text/javascript">
        var preloader;
        var adCompleteFlag = false;
        var resCompleteFlag = false;

        var adEndComplete = false;
        var resEndComplete = false;

        judgeLanTitle();

        function judgeLanTitle() {

            //        console.log("window.navigator.language",window.navigator.language);

            if (window.navigator.language == "zh-CN" || window.navigator.language == "zh-cn") {
                document.title = "小游戏：合成大西瓜";
            } else if (window.navigator.language == "zh-TW") {
                document.title = "小遊戲：合成大西瓜";
            } else if (window.navigator.language == "zh-HK") {
                document.title = "小遊戲：合成大西瓜";
            } else if (window.navigator.language == "ko-KR") {
                document.title = "작은 놀이：큰 수박 을 합성 하 다";
            } else if (window.navigator.language == "ja-JP") {
                document.title = "ミニゲーム：合成スイカ";
            } else if (window.navigator.language == "th-TH") {
                document.title = "เกมเล็กๆ：แตงโมสังเคราะห์";
            } else {
                document.title = "Little game：Synthetic watermelon";
            }
            document.title = "合成大慈慈";


        }

        var loadintT = document.getElementById("loadingText");
        var loadintGif = document.getElementById("loadingImg")
        setTimeout(function() {
            loadintGif.remove();
            loadintT.style.display = ""
            updateLabView(0.1);
        }, 1 * 1000)

        window.timer = null;
        window.tempSeconds = 1;
        window.loadData = {};
        loadData.completedCount = 0;
        loadData.totalCount = 0;

        onload();

        function onload() {
            var vv = window.visualViewport;
            var availW = vv ? vv.width : document.documentElement.clientWidth;
            var availH = vv ? vv.height : document.documentElement.clientHeight;
            var de = document.documentElement;
            if (de) {
                de.style.width = Math.round(availW) + "px";
                de.style.height = Math.round(availH) + "px";
            }
            var body = document.body;
            if (body) {
                body.style.width = Math.round(availW) + "px";
                body.style.height = Math.round(availH) + "px";
                body.style.left = (vv ? Math.round(vv.offsetLeft) : 0) + "px";
                body.style.top = (vv ? Math.round(vv.offsetTop) : 0) + "px";
            }
            var dw = 720, dh = 1560;
            var s = Math.min(availW / dw, availH / dh);
            var cw = Math.round(dw * s), ch = Math.round(dh * s);
            var div = document.getElementById("canvasDiv");
            div.style.width = cw + "px";
            div.style.height = ch + "px";
            div.style.left = Math.round((availW - cw) / 2) + "px";
            div.style.top = Math.round((availH - ch) / 2) + "px";
        };
        window.addEventListener("resize", onload);
        window.addEventListener("orientationchange", onload);
        window.onload = function() {
            document.getElementById("block-Box").style.display = "none";
        }

        function updateLabView(t) {
            if (timer != null) {
                clearInterval(timer);
            }
            timer = setInterval(function() {
                tempSeconds++;
                actualTotal();
                var loadintT = document.getElementById("loadingText")
                if (!loadintT) {
                    return;
                }
                loadintT.innerHTML = 'loading......' + parseInt(tempSeconds) + '%';

                switch (tempSeconds) {
                    case 20:
                        updateLabView(0.2);
                        break;
                    case 40:
                        updateLabView(0.3);
                        break;
                    case 60:
                        updateLabView(0.4);
                        break;
                    case 96:
                        updateLabView(5);
                        break;
                    case 97:
                        updateLabView(10);
                        break;
                    case 98:
                        updateLabView(50);
                        break;
                    case 99:
                        updateLabView(100);
                        break;
                    default:
                        if (tempSeconds >= 80 && tempSeconds < 96) {
                            updateLabView(t + 0.1);
                        }
                        break;
                }
                if (tempSeconds > 100) {
                    clearInterval(timer);
                    tempSeconds = 100
                    loadintT.innerHTML = 'loading......' + parseInt(tempSeconds) + '%';
                }
            }, t * 1000);
        }

        function actualTotal() {
            var percent = parseInt(100 * loadData.completedCount / loadData.totalCount);
            if (percent > tempSeconds && loadData.totalCount > 1) {
                tempSeconds = percent;
            }
        }


        /*setTimeout("ShowBannerAD()","2000");*/
    </script>
